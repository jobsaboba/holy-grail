name: settle grail

# Settles + republishes the Holy Grail data straight from GitHub's
# servers. The FIRST run of the day is the morning publish: full scoring
# (stats included) — that sheet is the record. Every later 15-min run is
# settle-only: it patches results and the bank off the stored sheet,
# never re-scoring. Commits any change and pushes — the phone app's ⟳
# then shows it. Sporting Life is scraped live on every run.

on:
  schedule:
    - cron: "*/15 7-21 * * *"   # every 15 min, 07:00–21:45 London (Nov: UTC=GMT)
  workflow_dispatch:            # manual "settle right now" kicker

permissions:
  contents: write

concurrency:
  group: grail-settle
  cancel-in-progress: true

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: dependencies
        run: pip install -q requests beautifulsoup4
      - name: settle today + yesterday
        env:
          GRAIL_APP_DIR: ${{ github.workspace }}
        run: |
          T=$(TZ=Europe/London date +%F)
          Y=$(TZ=Europe/London date -d "yesterday" +%F)
          if [ ! -f "data/$T.json" ]; then
            # MORNING PUBLISH — the one full scoring run of the day: stats
            # are scored here and this becomes the sheet of record.
            echo "=== morning publish $Y (full score) ==="
            python3 pipeline/score_grail.py --date "$Y" --refresh --publish
            echo "=== morning publish $T (full score) ==="
            python3 pipeline/score_grail.py --date "$T" --refresh --publish
          else
            # today's sheet already published — settle only: results + bank
            echo "=== settle-only $T ==="
            python3 pipeline/score_grail.py --date "$T" --refresh --settle
            echo "=== settle-only $Y ==="
            python3 pipeline/score_grail.py --date "$Y" --refresh --settle
          fi
