name: settle grail

# Settles + republishes the Holy Grail data straight from GitHub's
# servers: scores today (and yesterday for late finishes), commits any
# change and pushes — the phone app's ⟳ then shows it. Sporting Life /
# Racing Manager / HRN are scraped live on every run; nothing carries
# over between runs.

on:
  schedule:
    - cron: "*/15 7-21 * * *"   # every 15 min, 07:00–21:45 London (Nov: UTC=GMT)
  workflow_dispatch:            # manual "settle right now" kicker

permissions:
  contents: write

concurrency:
  group: grail-settle
  cancel-in-progress: true

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: dependencies
        run: pip install -q requests beautifulsoup4
      - name: settle today + yesterday
        env:
          GRAIL_APP_DIR: ${{ github.workspace }}
        run: |
          T=$(TZ=Europe/London date +%F)
          Y=$(TZ=Europe/London date -d "yesterday" +%F)
          echo "=== $T ==="
          python3 pipeline/score_grail.py --date "$T" --refresh --publish
          echo "=== $Y ==="
          python3 pipeline/score_grail.py --date "$Y" --refresh --publish
